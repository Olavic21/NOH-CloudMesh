<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N.O.H. CloudMesh – Maquettes interactives</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<header class="demo">
  <b>N.O.H. CloudMesh · maquettes</b>
  <div class="seg" id="sd">
    <button data-v="mobile"><i data-lucide="smartphone"></i>Mobile</button>
    <button data-v="desktop"><i data-lucide="monitor"></i>Desktop</button>
  </div>
  <div class="seg" id="sr">
    <button data-v="student"><i data-lucide="graduation-cap"></i>Étudiant</button>
    <button data-v="agent"><i data-lucide="clipboard-check"></i>Agent</button>
    <button data-v="admin"><i data-lucide="shield"></i>Administrateur</button>
  </div>
</header>
<div class="stage"><div id="dev" class="device"></div></div>
<script src="js/app.js"></script>
<script src="js/index.js"></script>
</body>
</html>
